    <style>
      :root {
        --bg: #f6f7f9;
        --s: #fff;
        --b: #e6e8ec;
        --t: #14171f;
        --m: #6b7280;
        --p: #2563eb;
        --ps: #eff4ff;
        --ok: #0f8a4f;
        --okb: #e7f6ee;
        --wn: #a86a0c;
        --wnb: #fdf3e0;
        --er: #c93b3b;
        --erb: #fdecec;
        --in: #2563eb;
        --inb: #eaf1ff;
        --mu: #5b6472;
        --mub: #eef0f3;
        --sh: 0 1px 2px rgba(16, 24, 40, 0.05);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #181c24;
          --s: #21262f;
          --b: #343b48;
          --t: #eceef2;
          --m: #a0a8b6;
          --ps: #263559;
          --ok: #4cc38a;
          --okb: #173628;
          --wn: #e0a94a;
          --wnb: #38301a;
          --er: #ef7b7b;
          --erb: #3d2226;
          --in: #7aa2ff;
          --inb: #263559;
          --mu: #b0b7c4;
          --mub: #2c323d;
          --p: #5b8def;
        }
      }
      :root[data-theme="dark"] {
        --bg: #181c24;
        --s: #21262f;
        --b: #343b48;
        --t: #eceef2;
        --m: #a0a8b6;
        --ps: #263559;
        --ok: #4cc38a;
        --okb: #173628;
        --wn: #e0a94a;
        --wnb: #38301a;
        --er: #ef7b7b;
        --erb: #3d2226;
        --in: #7aa2ff;
        --inb: #263559;
        --mu: #b0b7c4;
        --mub: #2c323d;
        --p: #5b8def;
      }
      * {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        overflow: hidden;
      }
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--t);
        font:
          400 13px/1.45 "Readex Pro",
          system-ui,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      h1 {
        font-size: 26px;
        font-weight: 600;
        margin: 0;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      p {
        margin: 0;
      }
      .mu {
        color: var(--m);
      }
      #app {
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: minmax(0, 1fr);
        height: 100%;
      }
      aside {
        width: 56px;
        background: var(--s);
        border-right: 1px solid var(--b);
        padding: 12px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        transition: width 0.15s;
        overflow: hidden;
      }
      aside.open {
        width: 208px;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2px 0 14px;
        cursor: pointer;
      }
      aside.open .brand {
        justify-content: flex-start;
        padding-left: 8px;
      }
      .bfull,
      .bsym,
      .lgo {
        background-repeat: no-repeat;
        background-size: contain;
      }
      .bfull {
        display: none;
        width: 84px;
        height: 52px;
        background-position: left center;
        background-image: var(--lg-full);
      }
      .bsym {
        display: block;
        width: 32px;
        height: 36px;
        background-position: center;
        background-image: var(--lg-sym);
      }
      aside.open .bfull {
        display: block;
      }
      aside.open .bsym {
        display: none;
      }
      .lgo {
        width: 140px;
        height: 86px;
        margin: 0 auto 10px;
        background-position: center;
        background-image: var(--lg-full);
      }

      .nav a {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 9px 10px;
        border-radius: 11px;
        color: var(--m);
        white-space: nowrap;
        cursor: pointer;
      }
      .nav a:hover {
        color: var(--t);
      }
      .nav a.on {
        background: var(--ps);
        color: var(--p);
        font-weight: 500;
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--p) 14%, transparent),
          0 4px 14px -8px color-mix(in srgb, var(--p) 30%, transparent);
      }
      .nav span {
        opacity: 0;
      }
      aside.open .nav span {
        opacity: 1;
      }
      svg.i {
        width: 18px;
        height: 18px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: auto;
        height: 100%;
        background: radial-gradient(
          800px 340px at 85% -80px,
          color-mix(in srgb, var(--p) 5%, transparent),
          transparent 70%
        );
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--s);
        border-bottom: 1px solid var(--b);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 32px;
        min-height: 72px;
        flex-wrap: wrap;
      }
      .sw {
        position: relative;
        flex: 1;
        max-width: 660px;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        border: 1px solid var(--b);
        border-radius: 12px;
        background: var(--bg);
        padding: 0 12px;
      }
      .sw:focus-within {
        border-color: var(--p);
      }
      .sw > svg {
        flex: none;
        color: var(--m);
      }
      .in {
        width: 100%;
        height: 36px;
        border: 1px solid var(--b);
        border-radius: 12px;
        background: var(--bg);
        padding: 0 12px;
        outline: 0;
      }
      .in:focus {
        border-color: var(--p);
      }
      .sw input {
        border: 0;
        background: 0;
        outline: 0;
        height: 100%;
        min-width: 0;
        flex: 1;
      }
      .sw input[type="date"] {
        flex: none;
        width: 92px;
        padding: 0;
        color: var(--m);
        font-size: 11px;
      }
      .sw input[type="date"]::-webkit-calendar-picker-indicator {
        width: 11px;
        height: 11px;
        margin: 0 0 0 2px;
        padding: 0;
      }
      .sw b {
        width: 1px;
        height: 18px;
        background: var(--b);
      }
      #res {
        position: absolute;
        top: 42px;
        left: 0;
        right: 0;
        background: var(--s);
        border: 1px solid var(--b);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        padding: 6px;
        display: none;
      }
      #res div {
        display: flex;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      #res div:hover {
        background: var(--ps);
      }
      #res small {
        color: var(--m);
        width: 58px;
        flex: none;
      }
      .pg {
        padding: 32px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .ph {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        flex-wrap: wrap;
      }
      .btn {
        height: 34px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid var(--b);
        background: var(--s);
        cursor: pointer;
        font-weight: 500;
      }
      .btn:hover {
        background: var(--bg);
      }
      .btn.p {
        background: var(--p);
        border-color: var(--p);
        color: #fff;
        box-shadow: 0 4px 14px -6px
          color-mix(in srgb, var(--p) 38%, transparent);
      }
      .btn.p:hover {
        opacity: 0.92;
      }
      .c {
        background: var(--s);
        border: 1px solid var(--b);
        border-radius: 24px;
        box-shadow:
          var(--sh),
          0 10px 30px -20px color-mix(in srgb, var(--p) 22%, transparent);
      }
      .kc {
        --g: #2563eb;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(
            110% 100% at 100% 0%,
            color-mix(in srgb, var(--g) 8%, transparent),
            transparent 62%
          ),
          var(--s);
        border-color: color-mix(in srgb, var(--g) 16%, var(--b));
        box-shadow:
          var(--sh),
          0 10px 28px -14px color-mix(in srgb, var(--g) 30%, transparent);
      }
      .kc > div {
        position: relative;
      }
      .kc .ki {
        position: absolute;
        right: -22px;
        bottom: -26px;
        width: 104px;
        height: 104px;
        color: var(--g);
        opacity: 0.16;
        stroke-width: 1.3;
        pointer-events: none;
      }
      .lg {
        display: flex;
        gap: 14px;
        align-items: center;
        color: var(--m);
        font-size: 12px;
      }
      .lg i {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 6px;
      }
      .hv rect {
        fill: transparent;
      }
      .hv rect:hover {
        fill: color-mix(in srgb, var(--p) 6%, transparent);
      }
      .sf {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 300px;
      }
      .sf:focus-within {
        border-color: var(--p);
      }
      .sf input {
        border: 0;
        background: 0;
        outline: 0;
        height: 100%;
        min-width: 0;
        flex: 1;
      }
      .sf input[type="date"] {
        flex: none;
        width: 122px;
        color: var(--m);
        font-size: 12px;
      }
      .sf b {
        width: 1px;
        height: 18px;
        background: var(--b);
      }
      .qa {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .qa i {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: var(--ps);
        color: var(--p);
        display: grid;
        place-items: center;
        flex: none;
      }
      .cg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 20px;
      }
      .cd {
        cursor: pointer;
        overflow: hidden;
      }
      .cd:hover {
        border-color: color-mix(in srgb, var(--p) 40%, var(--b));
      }
      .cd .img {
        aspect-ratio: 16/9;
        border-radius: 0;
      }
      .pw {
        position: relative;
      }
      .pop {
        position: absolute;
        right: 0;
        top: 46px;
        width: 250px;
        background: var(--s);
        border: 1px solid var(--b);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        display: none;
        overflow: hidden;
        z-index: 9;
